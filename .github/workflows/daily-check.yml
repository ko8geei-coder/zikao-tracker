name: 每日数据核查

on:
  schedule:
    # 每天北京时间 9:00 和 21:00 各执行一次
    - cron: '0 1 * * *'   # UTC 1:00 = 北京 9:00
    - cron: '0 13 * * *'  # UTC 13:00 = 北京 21:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 核查报告
        run: |
          node -e "
          const fs = require('fs');
          // 数据已内联在 index.html（单文件设计），不再读取 data.js
          const src = fs.readFileSync('index.html','utf8');
          const chk = [...src.matchAll(/chk:\"(\d{4}-\d{2}-\d{2})\"/g)].map(m => m[1]);
          const ends = [...src.matchAll(/end:\"(\d{4}-\d{2}-\d{2})\"/g)].map(m => m[1]);
          const today = new Date().toISOString().split('T')[0];
          console.log('=== 自考看板每日核查报告 ===');
          console.log('日期:', today);
          console.log('chk 字段数:', chk.length);
          console.log('未过期节点数:', ends.filter(d => d >= today).length);
          console.log('最近核查日:', chk.sort().pop() || '无');
          "

      - name: 更新核查日期
        run: |
          TODAY=$(date +%Y-%m-%d)
          # 更新 index.html 中的核查日期与各省份 chk 字段
          sed -i "s/数据核查日期 [0-9-]*/数据核查日期 ${TODAY}/" index.html || true
          sed -i "s/chk:\"[0-9-]*\"/chk:\"${TODAY}\"/g" index.html || true

          git config user.name "github-actions"
          git config user.email "action@github.com"

          if git diff --quiet; then
            echo "无数据变化，跳过提交"
          else
            git add -A
            git commit -m "自动更新：数据核查日期 ${TODAY}"
            git push
          fi
